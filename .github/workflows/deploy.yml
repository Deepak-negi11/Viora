name: Deploy production (Azure)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: viora-production
  cancel-in-progress: false

env:
  REGISTRY: vioraregistry.azurecr.io
  RESOURCE_GROUP: viora-rg
  CLUSTER_NAME: viora-production
  NAMESPACE: viora
  API_URL: https://api.vioraa.tech
  SITE_URL: https://vioraa.tech

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: cd packages/db && bunx prisma generate

      - name: Check server types
        run: cd apps/server && bunx tsc --noEmit

      - name: Lint web
        run: cd apps/web && bunx eslint . --max-warnings 0

      - name: Check web types
        run: cd apps/web && bunx next typegen && bunx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/server:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/web:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.API_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || 'phc_CYmWjbbGEYbAcupyTXwFRVeaR7NBsFv4B7WG2ThEwUhe' }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set kubectl context to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Record current images for rollback
        run: |
          kubectl get deployment viora-server -n $NAMESPACE \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}' > /tmp/previous-server-image
          kubectl get deployment viora-web -n $NAMESPACE \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="web")].image}' > /tmp/previous-web-image

      - name: Apply manifests
        run: kubectl apply -f k8s/namespace.yaml -f k8s/service-account.yaml -f k8s/server.yaml -f k8s/web.yaml

      - name: Point deployments at the new images
        run: |
          kubectl set image deployment/viora-server \
            server=$REGISTRY/server:${{ needs.build.outputs.image_tag }} \
            migrate-database=$REGISTRY/server:${{ needs.build.outputs.image_tag }} \
            -n $NAMESPACE
          kubectl set image deployment/viora-web \
            web=$REGISTRY/web:${{ needs.build.outputs.image_tag }} \
            -n $NAMESPACE

      - name: Wait for server rollout
        run: kubectl rollout status deployment/viora-server -n $NAMESPACE --timeout=10m

      - name: Wait for web rollout
        run: kubectl rollout status deployment/viora-web -n $NAMESPACE --timeout=10m

      - name: Verify production
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "API healthy"
              SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL")
              echo "Site status: $SITE_STATUS"
              if [ "$SITE_STATUS" = "200" ]; then
                echo "Production verified"
                exit 0
              fi
            fi
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Production verification failed"
          exit 1

      - name: Rollback on failed verification
        if: failure()
        run: |
          echo "Rolling back to previously deployed images"
          kubectl set image deployment/viora-server \
            server="$(cat /tmp/previous-server-image)" \
            migrate-database="$(cat /tmp/previous-server-image)" \
            -n $NAMESPACE
          kubectl set image deployment/viora-web \
            web="$(cat /tmp/previous-web-image)" \
            -n $NAMESPACE
          kubectl rollout status deployment/viora-server -n $NAMESPACE --timeout=10m
          kubectl rollout status deployment/viora-web -n $NAMESPACE --timeout=10m
