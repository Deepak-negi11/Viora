apiVersion: apps/v1
kind: Deployment
metadata:
  name: viora-server
  namespace: viora
  labels:
    app.kubernetes.io/name: viora-server
    app.kubernetes.io/part-of: viora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viora-server
  template:
    metadata:
      labels:
        app: viora-server
    spec:
      serviceAccountName: viora-runtime
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate-database
          image: vioraregistry.azurecr.io/server:1.0.1
          imagePullPolicy: IfNotPresent
          workingDir: /usr/src/app/packages/db
          command: ["bunx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: viora-server-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      containers:
        - name: server
          image: vioraregistry.azurecr.io/server:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CORS_ORIGIN
              value: https://vioraa.tech,https://www.vioraa.tech
          envFrom:
            - secretRef:
                name: viora-server-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: viora-server
  namespace: viora
  labels:
    app.kubernetes.io/name: viora-server
    app.kubernetes.io/part-of: viora
spec:
  selector:
    app: viora-server
  ports:
    - name: http
      port: 80
      targetPort: http
