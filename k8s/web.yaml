apiVersion: apps/v1
kind: Deployment
metadata:
  name: viora-web
  namespace: viora
  labels:
    app.kubernetes.io/name: viora-web
    app.kubernetes.io/part-of: viora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viora-web
  template:
    metadata:
      labels:
        app: viora-web
    spec:
      serviceAccountName: viora-runtime
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: registry.digitalocean.com/viora-registry/web:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: viora-web
  namespace: viora
  labels:
    app.kubernetes.io/name: viora-web
    app.kubernetes.io/part-of: viora
spec:
  selector:
    app: viora-web
  ports:
    - name: http
      port: 80
      targetPort: http
